<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Mobile Voice Typing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Mobile Voice Typing</h1>

    <label for="room">PC room code</label>
    <input id="room" maxlength="12" placeholder="Example: 4K7A2B" autocomplete="off">
    <button id="connect" type="button">Connect to PC</button>

    <label for="language">Language</label>
    <select id="language">
      <option value="bn-BD">বাংলা (Bangla)</option>
      <option value="en-US">English</option>
    </select>

    <label for="text">Spoken text</label>
    <textarea id="text" rows="8" aria-label="Spoken text"></textarea>

    <div class="row">
      <button id="listen" type="button" class="primary">🎙 Start speaking</button>
      <button id="keyboard-mic" type="button">Use keyboard mic</button>
      <button id="send" type="button">Send</button>
    </div>
    <p id="status" class="status">Enter the PC room code</p>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const roomInput = document.querySelector("#room");
    const connectButton = document.querySelector("#connect");
    const languageInput = document.querySelector("#language");
    const textInput = document.querySelector("#text");
    const listenButton = document.querySelector("#listen");
    const keyboardMicButton = document.querySelector("#keyboard-mic");
    const status = document.querySelector("#status");

    const roomFromUrl = new URLSearchParams(window.location.search).get("room");
    roomInput.value = (roomFromUrl || localStorage.getItem("voice-room") || "")
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, "")
      .slice(0, 12);

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let listening = false;
    let recognitionError = "";
    let finalTranscript = "";

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        listening = true;
        listenButton.textContent = "⏹ Stop speaking";
        status.textContent = "Listening...";
      };
      recognition.onend = () => {
        listening = false;
        listenButton.textContent = "🎙 Start speaking";
        if (recognitionError) return;
        if (finalTranscript.trim()) {
          sendText(true, finalTranscript);
        } else {
          status.textContent = "No final speech was recognized. Try again or use the keyboard mic.";
        }
      };
      recognition.onerror = (event) => {
        const messages = {
          "not-allowed": window.isSecureContext
            ? "Microphone blocked. Allow microphone access for this site in Chrome settings, then reload."
            : "Chrome blocks this page's microphone on a local HTTP link. Use your keyboard microphone in the text box, then tap Send. The built-in mic needs HTTPS.",
          "service-not-allowed": "Speech service is blocked. Check phone settings and internet, then try Chrome.",
          "audio-capture": "No microphone found. Check your phone microphone.",
          "network": "Speech service needs internet. Check your connection and try again.",
          "no-speech": "No speech heard. Tap Start speaking and try again.",
          "language-not-supported": "This speech language is not supported on your phone. Try English."
        };
        recognitionError = messages[event.error] || `Voice recognition error: ${event.error}`;
        status.textContent = recognitionError;
      };
      recognition.onresult = (event) => {
        recognitionError = "";
        let interimTranscript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }
        textInput.value = finalTranscript + interimTranscript;
      };
    } else {
      status.textContent = "Voice recognition is unavailable here. Use your phone keyboard's microphone.";
    }

    function connect(onConnected = () => {}) {
      const roomId = roomInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
      roomInput.value = roomId;
      if (!/^[A-Z0-9]{6,12}$/.test(roomId)) {
        status.textContent = "Enter the 6–12 letter/number room code shown on the PC.";
        onConnected(false);
        return;
      }
      if (!socket.connected) {
        status.textContent = "Connecting to server...";
        onConnected(false);
        return;
      }
      localStorage.setItem("voice-room", roomId);
      socket.emit("join-device", { roomId, role: "mobile" }, (result) => {
        if (!result?.ok) {
          status.textContent = result?.error || "Could not connect to the PC room.";
          onConnected(false);
          return;
        }
        if (!result.peerCount) {
          status.textContent = `Room ${result.roomId} joined, but the PC receiver is not connected yet.`;
          onConnected(false);
          return;
        }
        status.textContent = `Connected to PC room ${result.roomId}`;
        onConnected(true);
      });
    }

    function sendText(final = true, text = textInput.value) {
      const roomId = roomInput.value.trim().toUpperCase();
      if (!roomId) {
        status.textContent = "Enter the PC room code first";
        return;
      }
      if (!socket.connected) {
        status.textContent = "Disconnected from server. Reconnecting...";
        return;
      }
      if (!text.trim()) {
        status.textContent = "There is no text to send.";
        return;
      }
      socket.timeout(5000).emit("voice-text", { roomId, text, final }, (error, result) => {
        if (error || !result?.ok) {
          status.textContent = result?.error || "Send failed. Check the PC connection and try again.";
          return;
        }
        if (final) {
          textInput.value = "";
          finalTranscript = "";
          status.textContent = "Sent to PC — ready for the next phrase.";
        }
      });
    }

    connectButton.addEventListener("click", () => connect());
    roomInput.addEventListener("input", () => {
      roomInput.value = roomInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
    });
    roomInput.addEventListener("change", () => connect());
    socket.on("connect", () => {
      if (roomInput.value.trim()) connect();
      else status.textContent = "Server connected — enter the PC room code.";
    });
    socket.on("disconnect", () => {
      status.textContent = "Disconnected from server. Reconnecting...";
    });
    socket.on("connect_error", () => {
      status.textContent = "Cannot reach the PC server. Check Wi-Fi and the HTTPS link.";
    });
    languageInput.addEventListener("change", () => {
      if (recognition) recognition.lang = languageInput.value;
    });

    listenButton.addEventListener("click", () => {
      if (!roomInput.value.trim()) {
        status.textContent = "Enter the PC room code first";
        return;
      }
      if (!recognition) {
        textInput.focus();
        status.textContent = "Tap the microphone on your phone keyboard to dictate, then tap Send.";
        return;
      }
      if (!window.isSecureContext) {
        textInput.focus();
        status.textContent = "For same-Wi-Fi HTTP, use the phone keyboard mic. The built-in mic requires the trusted HTTPS link.";
        return;
      }
      if (listening) {
        recognition.stop();
        return;
      }
      connect((connected) => {
        if (!connected) return;
        recognition.lang = languageInput.value;
        recognitionError = "";
        finalTranscript = textInput.value;
        try {
          recognition.start();
        } catch (error) {
          status.textContent = error.name === "NotAllowedError"
            ? "Microphone blocked. Allow microphone access for this site, then reload."
            : `Could not start voice recognition: ${error.message}`;
        }
      });
    });

    document.querySelector("#send").addEventListener("click", () => {
      if (listening && recognition) {
        recognition.stop();
        return;
      }
      sendText(true);
    });
    keyboardMicButton.addEventListener("click", () => {
      textInput.focus();
      status.textContent = "Tap the microphone on your phone keyboard to dictate, then tap Send.";
    });
    if (recognition) recognition.lang = languageInput.value;
  </script>
</body>
</html>
