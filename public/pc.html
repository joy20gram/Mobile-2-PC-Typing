<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PC Voice Text Receiver</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>PC Text Receiver</h1>
    <p>Connect the desktop helper too if you want to type into the active Windows app.</p>

    <label for="room">Room code</label>
    <div class="row">
      <input id="room" maxlength="12" placeholder="Generating..." autocomplete="off">
      <button id="connect" type="button">Connect</button>
    </div>
    <section class="pairing" aria-label="Connect a phone by QR code">
      <img id="pairing-qr" alt="Scan to open the mobile app with this room code">
      <p id="pairing-link">Scan this QR with your phone camera to connect automatically.</p>
    </section>

    <label for="output">Received text</label>
    <textarea id="output" rows="14" aria-label="Received text"></textarea>

    <div class="row">
      <button id="copy" type="button">Copy</button>
      <button id="clear" type="button" class="danger">Clear screen</button>
    </div>
    <p id="status" class="status">Not connected</p>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const roomInput = document.querySelector("#room");
    const output = document.querySelector("#output");
    const status = document.querySelector("#status");
    const pairingQr = document.querySelector("#pairing-qr");
    const pairingLink = document.querySelector("#pairing-link");

    const roomFromUrl = new URLSearchParams(window.location.search).get("room");
    const savedRoom = roomFromUrl || localStorage.getItem("voice-room");
    roomInput.value = savedRoom || Array.from(crypto.getRandomValues(new Uint8Array(12)), value => "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"[value % 36]).join("");

    function normalizeRoomInput() {
      roomInput.value = roomInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
      return roomInput.value;
    }

    async function updatePairingQr(roomId) {
      try {
        const response = await fetch(`/api/pairing-qr?room=${encodeURIComponent(roomId)}`);
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "QR code generation failed");
        pairingQr.src = result.dataUrl;
        pairingLink.textContent = result.mobileUrl;
      } catch {
        pairingLink.textContent = "Could not create QR code. Check the room code and refresh.";
      }
    }

    function connect() {
      const roomId = normalizeRoomInput();
      if (!/^[A-Z0-9]{6,12}$/.test(roomId)) {
        status.textContent = "Room code must be 6–12 letters or numbers.";
        return;
      }
      localStorage.setItem("voice-room", roomId);
      updatePairingQr(roomId);
      if (!socket.connected) {
        status.textContent = "Connecting to server...";
        return;
      }
      socket.emit("join-device", { roomId, role: "pc" }, (result) => {
        if (!result?.ok) {
          status.textContent = result?.error || "Could not connect to room";
          return;
        }
        roomInput.value = result.roomId;
        status.textContent = result.peerCount
          ? `Connected to room ${result.roomId}`
          : `Room ${result.roomId} ready — waiting for phone`;
      });
    }

    document.querySelector("#connect").addEventListener("click", connect);
    roomInput.addEventListener("input", normalizeRoomInput);
    document.querySelector("#copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(output.value);
        status.textContent = "Text copied";
      } catch {
        status.textContent = "Copy failed — select and copy the text manually";
      }
    });
    document.querySelector("#clear").addEventListener("click", () => {
      output.value = "";
    });

    socket.on("connect", connect);
    socket.on("disconnect", () => {
      status.textContent = "Disconnected — reconnecting...";
    });
    socket.on("connect_error", () => {
      status.textContent = "Cannot reach the server. Check that the PC server is running.";
    });
    socket.on("desktop-typing-state", ({ armed }) => {
      status.textContent = armed
        ? "Active Windows app typing is armed."
        : "Active Windows app typing is disarmed.";
    });
    socket.on("text-update", ({ text, final }) => {
      if (!final) return;
      const start = output.selectionStart;
      const end = output.selectionEnd;
      output.setRangeText(text, start, end, "end");
      status.textContent = "Text received";
    });
  </script>
</body>
</html>
